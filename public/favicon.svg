<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Puddle">
  <!--
    A specimen trace, plotted from the demo dataset's own weekly means (Coffee,
    eight samples across seventy-two weeks) rather than drawn. The dip at the
    sixth point and the fall at the last are in the data; a favicon that invented
    a smooth rise would be the one shape this product is not about.

    Colours are the specimen sheet's, except the reading point: --color-stamp is
    a deep violet chosen against a near-white sheet, and it goes muddy on the
    dark ground a tab strip needs. The lighter violet here is that token's job
    done at this size.
  -->
  <rect width="32" height="32" fill="#334230"/>
  <polyline points="4,25 7.4,24.9 10.9,18.1 14.3,15.9 17.7,12.2 21.1,15.5 24.6,7 28,9.7"
            fill="none" stroke="#f2f3f1" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="17.7" cy="12.2" r="2.7" fill="#a855f7" stroke="#334230" stroke-width="1.3"/>
</svg>
